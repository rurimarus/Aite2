<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMD ➔ VRM Converter</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <header>
      <h1>🌐 MMD ➔ VRM Converter</h1>
      <p>ブラウザ完結型 MMD (.pmx/.pmd/zip) → VRM 1.0 / 0.0 変換ツール</p>
    </header>

    <main>
      <!-- Left Panel: File Upload & Metadata Controls -->
      <section class="panel">
        <h2>1. モデル読み込み & メタデータ</h2>

        <div class="dropzone" id="dropzone">
          📁 ファイルをドロップ
          <p>.pmx, .pmd または関連ZIPファイル</p>
          <input type="file" id="file-input" accept=".pmx,.pmd,.zip" multiple style="display: none;" />
        </div>

        <div class="form-group">
          <label for="meta-title">タイトル (Title)</label>
          <input type="text" id="meta-title" value="MMD Converted Character" />
        </div>

        <div class="form-group">
          <label for="meta-author">作者名 (Author)</label>
          <input type="text" id="meta-author" value="Model Author" />
        </div>

        <div class="form-group">
          <label for="meta-version">VRMバージョン (Target Version)</label>
          <select id="meta-version">
            <option value="1.0" selected>VRM 1.0 (デフォルト)</option>
            <option value="0.0">VRM 0.0</option>
          </select>
        </div>

        <div class="form-group">
          <label for="meta-commercial">商用利用許可 (Commercial Use)</label>
          <select id="meta-commercial">
            <option value="allow">許可 (Allow)</option>
            <option value="disallow">不許可 (Disallow)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="meta-avatar">アバター利用許可 (Avatar Permission)</label>
          <select id="meta-avatar">
            <option value="everyone">全員に許可 (Everyone)</option>
            <option value="onlyAuthor">作者のみ (Only Author)</option>
            <option value="explicitlyAllowedPerson">個別に許可された人のみ</option>
          </select>
        </div>
      </section>

      <!-- Center Panel: 3D Viewport -->
      <section class="viewer-container">
        <div id="canvas-holder"></div>
        <div class="viewer-overlay" id="model-info">
          モデル未選択 (ドラッグ＆ドロップで読み込み)
        </div>
      </section>

      <!-- Right Panel: Mapping & Export -->
      <section class="panel">
        <h2>2. マッピング設定 & エクスポート</h2>

        <div class="tabs">
          <button class="tab-btn active" id="tab-bones">ボーン (Humanoid)</button>
          <button class="tab-btn" id="tab-morphs">表情 (Expressions)</button>
        </div>

        <div id="bone-mapping-list" class="mapping-list" style="display: flex;">
          <p style="font-size: 0.85rem; color: var(--text-secondary);">モデルを読み込むとボーンリストが表示されます。</p>
        </div>

        <div id="morph-mapping-list" class="mapping-list" style="display: none;">
          <p style="font-size: 0.85rem; color: var(--text-secondary);">モデルを読み込むと表情リストが表示されます。</p>
        </div>

        <button class="btn btn-success" id="export-vrm-btn" style="margin-top: auto;">
          💾 VRMファイルをダウンロード (.vrm)
        </button>
      </section>
    </main>

    <script type="module" src="/src/components/AppUI.ts"></script>
  </body>
</html>
